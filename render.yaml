services:
  - type: web
    name: dividend-wiki-rag
    runtime: python
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r rag/requirements.txt
    startCommand: uvicorn rag.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: RAG_CORS_ORIGINS
        value: "*"
      - key: RAG_DOMAIN_DESC
        value: "a curated wiki of Wikipedia-style synthesis pages on regulation/governance and corporate dividend policy, plus 735 abstract-only source records"
      - key: RAG_OPENAI_BASE_URL
        sync: false
      - key: RAG_OPENAI_API_KEY
        sync: false
      - key: RAG_GEN_MODEL
        sync: false
